<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerMatch — Criar conta</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <!-- CADASTRO -->
    <main class="gm-login">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100 py-5">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                    <!-- CARD -->
                    <div class="gm-login-card">

                        <!-- LOGO E TÍTULO -->
                        <div class="text-center mb-4">
                            <a href="index.html" class="gm-login-logo">GM</a>
                            <h1 class="gm-login-title mt-3">CRIAR <span>CONTA</span></h1>
                            <p class="gm-login-subtitle">Crie sua conta e faça parte do GamerMatch.</p>
                        </div>

                        <!-- FORMULÁRIO -->
                        <form action="#" method="POST">

                            <!-- NOME E NICKNAME -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nomeReal" class="form-label">Nome completo</label>
                                    <input type="text" class="form-control gm-input" id="nomeReal" name="nomeReal" placeholder="Digite seu nome" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="nickName" class="form-label">Nickname</label>
                                    <input type="text" class="form-control gm-input" id="nickName" name="nickName" placeholder="Seu nome no jogo" required>
                                </div>
                            </div>

                            <!-- DATA DE NASCIMENTO E NACIONALIDADE -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="dtDeNascimento" class="form-label">Data de nascimento</label>
                                    <input type="date" class="form-control gm-input" id="dtDeNascimento" name="dtDeNascimento" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="nacionalidade" class="form-label">Nacionalidade</label>
                                    <input type="text" class="form-control gm-input" id="nacionalidade" name="nacionalidade" placeholder="Ex.: Brasileira" required>
                                </div>
                            </div>

                            <!-- LOGIN -->
                            <div class="mb-3">

                                <label for="login" class="form-label">Login</label>
                                <input type="text" class="form-control gm-input" id="login" name="login" placeholder="Escolha seu login" required>
                            </div>

                            <!-- SENHA -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="senha" class="form-label">Senha</label>
                                    <input type="password" class="form-control gm-input" id="senha" name="senha" placeholder="Digite sua senha" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="confirmarSenha" class="form-label">Confirmar senha</label>
                                    <input type="password" class="form-control gm-input" id="confirmarSenha" name="confirmarSenha" placeholder="Repita sua senha" required>
                                </div>
                            </div>

                            <!-- TERMOS -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termos" required>
                                <label class="form-check-label" for="termos">Concordo com os termos de uso.</label>
                            </div>

                            <!-- BOTÃO -->
                            <button type="submit" class="gm-btn-primary w-100 gm-login-button">CRIAR CONTA</button>
                        </form>

                        <!-- LOGIN -->
                        <div class="text-center mt-4">
                            <p class="gm-login-register">Já possui uma conta?<a href="login.html" class="gm-login-link">Entrar</a></p>
                        </div>

                        <!-- VOLTAR -->
                        <div class="text-center mt-3">
                            <a href="index.html" class="gm-back-link">← Voltar para o GamerMatch</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
