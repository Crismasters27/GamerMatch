<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerMatch — Entrar</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/estilo.css">

</head>

<body>

    <!-- LOGIN -->
    <main class="gm-login">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                    <!-- CARD -->
                    <div class="gm-login-card">
                        <!-- LOGO -->
                        <div class="text-center mb-4">
                            <a href="index.html" class="gm-login-logo">GM</a>
                            <h1 class="gm-login-title mt-3">GAMER<span>MATCH</span></h1>
                            <p class="gm-login-subtitle">Entre na sua conta e continue competindo.</p>
                        </div>

                        <!-- FORMULÁRIO -->
                        <form action="#" method="POST">

                        <!-- LOGIN -->
                        <div class="mb-3">
                        <label for="login" class="form-label">Login</label>
                                <input type="text" class="form-control gm-input" id="login" name="login" placeholder="Digite seu login" required>
                            </div>

                            <!-- SENHA -->
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control gm-input" id="senha" name="senha" placeholder="Digite sua senha" required>
                            </div>

                            <!-- LEMBRAR / ESQUECI -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="lembrar">
                                    <label class="form-check-label" for="lembrar">Lembrar-me</label>
                                </div>
                                <a href="#" class="gm-login-link"> Esqueci minha senha</a>
                            </div>

                            <!-- BOTÃO -->
                            <button type="submit" class="gm-btn-primary w-100 gm-login-button">ENTRAR</button>
                        </form>

                        <!-- CADASTRO -->
                        <div class="text-center mt-4">
                            <p class="gm-login-register">Ainda não possui uma conta?
                                <a href="cadastrar.html" class="gm-login-link">Cadastre-se</a>
                            </p>
                        </div>

                        <!-- VOLTAR -->
                        <div class="text-center mt-3">
                            <a href="index.html" class="gm-back-link">← Voltar para o GamerMatch</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
